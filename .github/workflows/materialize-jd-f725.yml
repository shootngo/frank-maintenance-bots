name: Materialize jd-f725 images (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-jd-f725.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: materialize-jd-f725
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    env:
      SLUG: jd-f725
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Add image refs to page shards for committed images
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          import json, os, glob, subprocess
          d = f"data/machines/{os.environ['SLUG']}"
          imgs = {os.path.basename(p) for p in glob.glob(f'{d}/img/*.webp')}
          for f in sorted(glob.glob(f'{d}/pages-*.json')):
              s = json.load(open(f, encoding='utf-8')); ch = 0
              for p in s:
                  nm = f"{p['page']:04d}.webp"
                  if nm in imgs and p.get('image') != nm: p['image'] = nm; ch += 1
              if ch:
                  open(f, 'w', encoding='utf-8').write(json.dumps(s, ensure_ascii=False, separators=(',', ':')))
                  subprocess.run(['git', 'add', f], check=True); print(f, ch)
          PY
      - name: Commit as bot and push (retry on conflict)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "V 1.1: ${SLUG} image refs in page shards"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            sleep $((i*3)); git pull --rebase origin main
            [ "$i" = 5 ] && exit 1
          done
      - name: Deploy Pages
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run pages.yml --ref main || true
