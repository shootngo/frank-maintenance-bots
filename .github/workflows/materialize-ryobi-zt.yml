name: Materialize ryobi-zt binaries (one-shot, batch 2)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-ryobi-zt.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: materialize-ryobi-zt
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    env:
      SLUG: ryobi-zt
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Render diagram pages from official Ryobi/TTI PDFs (no binaries through MCP)
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          python3 -m pip install -q --break-system-packages pillow==12.3.0
          mkdir -p /tmp/pdf
          curl -fsSL -o /tmp/pdf/rm8002.pdf "https://556aa8d9de68ea9c4f29-0a8acad11a4df5016d26cc39a7429843.ssl.cf1.rackcdn.com/2/RYRM8002_099262002_937_OM_trilingual_06.pdf"
          curl -fsSL -o /tmp/pdf/tti.pdf "https://servicedocs.ttibrands.com.au/assets/Uploads/docs/RYOBI-80V-ZTR-Troubleshooting-Guide-2022.07.19-1.pdf"
          echo "d296e6d3def7f81f2c61668d3761911a9eba2fb02b6344029850741533f99334  /tmp/pdf/rm8002.pdf" | sha256sum -c
          echo "88f40cb7263dd36dc3929891966233f37940185635aabd64dbf047d376acc632  /tmp/pdf/tti.pdf" | sha256sum -c
          cat > /tmp/render_small2.py <<'RENDER'
          #!/usr/bin/env python3
          """Render selected manual pages to small (~15KB) bilevel lossless WebP. Usage: render_small.py <pdfdir> <outdir>
          PDFs expected: ry48.pdf (RY48ZTR75/100 OM), rm8003.pdf (RYRM8003 OM, full 100 pages)."""
          import sys, subprocess, tempfile, glob, os
          from PIL import Image
          PAGES = {
           'rm8002': [10,11,12,14,16,17,23,24,25,27,28,29,31,32,33],
           'tti': [10,11,13,14,16,23,37,52,53,54,55],
          }
          def render(pdf, page, dest):
              with tempfile.TemporaryDirectory() as td:
                  subprocess.run(['pdftoppm','-f',str(page),'-l',str(page),'-gray','-r','150',pdf,td+'/p'],check=True)
                  im = Image.open(glob.glob(td+'/p*')[0]).convert('L')
              for w in (640, 600, 560, 520):
                  r = im.resize((w, round(im.height*w/im.width)), Image.LANCZOS).point(lambda x: 255 if x > 150 else 0)
                  r.convert('RGB').save(dest, 'WEBP', lossless=True, method=6, quality=100)
                  if os.path.getsize(dest) <= 16500: break
          if __name__ == '__main__':
              src, out = sys.argv[1], sys.argv[2]
              os.makedirs(out, exist_ok=True)
              for key, pages in PAGES.items():
                  for p in pages:
                      d = f'{out}/{key}-{p:04d}.webp'; render(f'{src}/{key}.pdf', p, d)
                      print(os.path.basename(d), os.path.getsize(d))
          RENDER
          python3 /tmp/render_small2.py /tmp/pdf "data/machines/${SLUG}/img"
          git add "data/machines/${SLUG}/img"
      - name: Commit as bot and push (retry on conflict)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "V 1.1: ${SLUG} images batch 2 (rendered from official PDFs)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            sleep $((i*3)); git pull --rebase origin main
            [ "$i" = 5 ] && exit 1
          done
      - name: Deploy Pages
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run pages.yml --ref main || true
