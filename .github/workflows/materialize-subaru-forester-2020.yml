name: Materialize subaru-forester-2020 binaries (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-subaru-forester-2020.yml'
      - 'data/machines/subaru-forester-2020/staging/BATCH'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: materialize-subaru-forester-2020
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    env:
      SLUG: subaru-forester-2020
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Render diagram pages from the public owner's manual PDF
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq poppler-utils webp >/dev/null
          python3 -m pip install -q pillow
          curl -fsSL -o /tmp/om.pdf https://cdn.dealereprocess.org/cdn/servicemanuals/subaru/2020-forester.pdf
          cat > /tmp/render.py <<'PY'
          import subprocess,os,sys,tempfile,hashlib
          from PIL import Image, ImageOps
          pdf,out=sys.argv[1],sys.argv[2]
          assert hashlib.md5(open(pdf,'rb').read()).hexdigest()=='82ceeebb75e4ae49de9d54ff7589d122','pdf mismatch'
          os.makedirs(out,exist_ok=True)
          for p in [24,28,428,429,432,433,461,462,467,486,502,504,507,509,512,552]:
            td=tempfile.mkdtemp()
            subprocess.run(['pdftoppm','-f',str(p),'-l',str(p),'-png','-r','200','-gray',pdf,td+'/p'],check=True)
            img=Image.open(td+'/'+sorted(os.listdir(td))[0]).convert('L'); w,h=img.size
            img=img.crop((int(w*.075),int(h*.12),int(w*.925),int(h*.86)))
            bb=ImageOps.invert(img).point(lambda v:255 if v>60 else 0).getbbox()
            img=img.crop((max(0,bb[0]-8),max(0,bb[1]-8),min(img.width,bb[2]+8),min(img.height,bb[3]+8)))
            dest=f'{out}/{p:04d}.webp'
            for W in (1300,1200,1100,1000,920,850,780,720,660):
              im=img.resize((W,int(img.height*W/img.width)),Image.LANCZOS) if img.width>W else img
              im.point(lambda v:255 if v>150 else 0).convert('L').save(td+'/q.png')
              subprocess.run(['cwebp','-quiet','-lossless','-z','9',td+'/q.png','-o',dest],check=True)
              if os.path.getsize(dest)<=14500: break
            print(p,im.size,os.path.getsize(dest),flush=True)
          PY
          python3 /tmp/render.py /tmp/om.pdf data/machines/${SLUG}/img
          git add data/machines/${SLUG}/img
      - name: Decode staged files
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          import base64, glob, os, struct, subprocess
          slug = os.environ['SLUG']; st = f'data/machines/{slug}/staging'; out = f'data/machines/{slug}/img'
          os.makedirs(out, exist_ok=True); ok = bad = 0
          for f in sorted(glob.glob(f'{st}/*.b64')):
              name = os.path.basename(f)[:-4]
              b = base64.b64decode(open(f).read())
              if name.endswith('.webp') and (b[:4] != b'RIFF' or b[8:12] != b'WEBP' or struct.unpack('<I', b[4:8])[0] + 8 != len(b)):
                  print('::warning::incomplete webp', name); bad += 1; continue
              open(f'{out}/{name}', 'wb').write(b)
              subprocess.run(['git', 'rm', '-q', f], check=True)
              subprocess.run(['git', 'add', f'{out}/{name}'], check=True); ok += 1
          print('materialized', ok, 'bad', bad)
          PY
      - name: Commit as bot and push (retry on conflict)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "V 1.1: ${SLUG} images (materialized from staging)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            sleep $((i*3)); git pull --rebase origin main
            [ "$i" = 5 ] && exit 1
          done
      - name: Deploy Pages
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run pages.yml --ref main || true
